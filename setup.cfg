[flake8]
extend-select = E,W
max-line-length = 79
extend-ignore = F,W503
exclude = .git,.venv,venv,__pycache__,.pytest_cache,htmlcov
# Standalone examples add the repository root before importing local packages.
per-file-ignores =
    examples/*: E402

[pycodestyle]
max-line-length = 79
ignore = E402,W503
exclude = .git,.venv,venv,__pycache__,.pytest_cache,htmlcov
